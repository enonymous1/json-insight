<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JSON Insight</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Inspect JSON files locally in your browser: analysis, tree view, and sortable table view. No uploads, no server."
    />
    <meta name="theme-color" content="#2d3748" />
    <!-- Theme before first paint: without this, a dark-preference user
      would see a light page flash before Angular boots and applies the
      theme. Keep the storage key in sync with THEME_STORAGE_KEY in
      src/app/theme.ts. Preference is stored locally only. -->
    <script>
      try {
        var storedTheme = window.localStorage.getItem('json-insight-theme');
        var wantsDark =
          storedTheme === 'dark' ||
          (storedTheme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (wantsDark) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        /* Storage or matchMedia unavailable: stay light. */
      }
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
